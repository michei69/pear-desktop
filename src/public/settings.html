<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Settings</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1b20;
      }

      #sui-boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #sui-boot-fallback::after {
        width: 28px;
        height: 28px;
        border: 3px solid #49454f;
        border-top-color: #d0bcff;
        border-radius: 50%;
        content: '';
        animation: sui-boot-spin 0.9s linear infinite;
      }

      @keyframes sui-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="sui-boot-fallback"></div>
  </body>
</html>
