packages:
  - apps/*
  - packages/*
  - plugins/*

minimumReleaseAge: 360
allowBuilds:
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  '@michei69/node-smtc': true
  unrs-resolver: true
  utf-8-validate: true
overrides:
  node-gyp: 13.0.0
  # electron 45's ABI (150) is unknown to node-abi 4.31, which @electron/rebuild resolves through.
  node-abi: 4.39.0
  xml2js: 0.6.2
  node-fetch: 3.3.2
  '@electron/universal': 3.0.4
  '@babel/runtime': 8.0.0
  electron: 45.0.0
  youtubei.js: 18.1.0
  hono: 4.13.13
  vite: 8.3.5
patchedDependencies:
  vudio@2.1.1: patches/vudio@2.1.1.patch
  '@malept/flatpak-bundler@0.4.0': patches/@malept__flatpak-bundler@0.4.0.patch
  kuromoji@0.1.2: patches/kuromoji@0.1.2.patch
engineStrict: true
