mac:
  minimumSystemVersion: '13.0'
  # Electron 42 moved macOS notifications to UNNotification, which macOS only
  # delivers for code-signed bundles: an unsigned build logs "addRequest not
  # allowed" from usernotificationsd and every Notification emits `failed`.
  # "-" opts in to ad-hoc signing (not notarization - we have no Developer ID);
  # it seals the bundle with its real CFBundleIdentifier, which is all macOS
  # checks here. electron-builder's default entitlements template already grants
  # com.apple.security.cs.disable-library-validation, so hardenedRuntime (on by
  # default) keeps working with an ad-hoc identity.
  identity: "-"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # macOS updates install from the zip, not the dmg: MacUpdater refuses an
    # update whose metadata lists no zip (ERR_UPDATER_ZIP_FILE_NOT_FOUND), so
    # without this target the mac build can check for updates but never apply
    # one. The dmg stays the download users are given.
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/generated/icons/mac/icon.icon
  compression: maximum
win:
  icon: assets/generated/icons/win/icon.ico
  files:
    - 'node_modules/node-smtc/**'
  target:
    - target: nsis-web
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  compression: maximum
nsisWeb:
  runAfterFinish: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: assets/generated/icons/png
  category: AudioVideo
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: "com.github.th-ch.\u0079\u006f\u0075\u0074\u0075\u0062\u0065\u002d\u006d\u0075\u0073\u0069\u0063"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: flatpak
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
    - target: freebsd
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
appImage:
  description: "\u0059\u006f\u0075\u0054\u0075\u0062\u0065\u0020\u004d\u0075\u0073\u0069\u0063 Desktop App bundled with custom plugins"
  category: AudioVideo
flatpak:
  description: "\u0059\u006f\u0075\u0054\u0075\u0062\u0065\u0020\u004d\u0075\u0073\u0069\u0063 Desktop App bundled with custom plugins"
  category: AudioVideo
  runtimeVersion: '26.08'
  baseVersion: '26.08'
  finishArgs:
    - '--socket=wayland'
    - '--socket=x11'
    - '--share=ipc'
    - '--device=dri'
    - '--socket=pulseaudio'
    - '--share=network'
    - '--filesystem=xdg-music:rw'
    - '--talk-name=org.freedesktop.Notifications'
    - '--talk-name=org.gnome.SessionManager'
    - '--talk-name=org.kde.StatusNotifierWatcher'
    - "--own-name=org.mpris.MediaPlayer2.\u0059\u006f\u0075\u0074\u0075\u0062\u0065\u004d\u0075\u0073\u0069\u0063.*"
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libasound2
    - libgbm1
rpm:
  depends:
    - libuuid
  fpm:
    - '--rpm-rpmbuild-define'
    - _build_id_links none
snap:
  slots:
    - mpris:
        interface: mpris
directories:
  output: ./pack/
