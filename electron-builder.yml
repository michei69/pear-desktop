asarUnpack:
  - assets
# Chromium ships 55 locale packs; the app's i18n directory has no translations
# for am/gu/mr/sw, so those four packs (~4.3 MiB) are the only ones dropped.
# Regional variants are listed because electron-builder matches a locale by its
# own name only (`en` does not match `en-US`). Windows/Linux packs use hyphens
# (`en-GB.pak`) while macOS .lproj bundles use underscores (`en_GB.lproj`), so
# both spellings are listed.
