name: Build PR Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  check-permissions:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    name: Check if user has write access
    runs-on: ubuntu-latest
    outputs:
      has-write-access: ${{ steps.check.outputs.require-result }}
    steps:
      - name: Check user permission
        id: check
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103
        with:
          require: write
          username: ${{ github.event.pull_request.user.login }}

  build:
    name: Build ${{ matrix.os }}
    needs: check-permissions
    if: needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only vite build without release if it is a fork, or it is a pull-request
      - name: Vite Build
        if: github.repository == 'michei69/pear-desktop'
        run: |
          pnpm build

      # Build and release if it's the main repository and is not pull-request
      - name: Build on Mac
        if: startsWith(matrix.os, 'macOS')
        run: |
          pnpm dist:mac
          pnpm dist:mac:arm64

      - name: Build on Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Platform/aarch64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/aarch64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/aarch64/24.08
          pnpm dist:linux
          pnpm dist:linux:deb-arm64
          pnpm dist:linux:rpm-arm64

      - name: Build on Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          pnpm dist:win

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-macos
          retention-days: 7
          path: |
            pack/*.dmg
            pack/*.dmg.blockmap

      - name: Upload Linux artifacts
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-linux
          retention-days: 7
          path: |
            pack/*.AppImage
            pack/*.deb
            pack/*.rpm
            pack/*.flatpak
            pack/*.snap
            pack/*.freebsd
            pack/*.tar.gz

      - name: Upload Windows artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          retention-days: 7
          path: |
            pack/*.exe
            pack/nsis-web/*.nsis.7z
            pack/nsis-web/*.exe

  comment:
    name: Comment on PR
    needs: [check-permissions, build]
    if: always() && needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const buildResult = '${{ needs.build.result }}';

            let comment;
            if (buildResult === 'success') {
              comment = `## 🚀 Build Artifacts Ready!

            The builds have completed successfully. You can download the artifacts from the workflow run:

            **[📦 Download Artifacts](${runUrl})**

            ### Available builds:
            - **Windows**: \`pear-desktop-windows\`
            - **macOS**: \`pear-desktop-macos\`
            - **Linux**: \`pear-desktop-linux\`

            *Note: Artifacts are available for 7 days.*`;
            } else if (buildResult === 'failure') {
              comment = `## ❌ Build Failed

            Unfortunately, one or more builds failed. Please check the workflow run for details:

            **[View Workflow Run](${runUrl})**`;
            } else {
              comment = `## ⚠️ Build Status: ${buildResult}

            The build process completed with status: **${buildResult}**

            **[View Workflow Run](${runUrl})**`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
