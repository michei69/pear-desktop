name: Release Pear Desktop

on:
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"
  # Baked into the build and shown in the About window (src/app-info.ts).
  PEAR_CHANNEL: stable
  PEAR_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Release build
    if: github.repository == 'michei69/pear-desktop' && github.ref == 'refs/heads/master'
    # Builds only produce artifacts, the publish job below owns the release.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-26, ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macos') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macos')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release:* scripts pass `-p never`: electron-builder writes the
      # installers and the latest*.yml updater metadata into pack/ but uploads
      # nothing. The publish job below attaches those files to the release.
      # The version in package.json is shipped unchanged, unlike the beta build,
      # which stamps `-beta.<run_number>` onto it.
      - name: Build on Mac
        if: startsWith(matrix.os, 'macos')
        run: pnpm release:mac

      - name: Build on Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/26.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/26.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/26.08
          sudo flatpak install -y flathub org.freedesktop.Platform/aarch64/26.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/aarch64/26.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/aarch64/26.08
          pnpm release:linux

      - name: Build on Windows
        if: startsWith(matrix.os, 'windows')
        run: pnpm release:win

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-macos
          path: |
            pack/*.dmg
            pack/*.dmg.blockmap
            pack/*.zip
            pack/*.zip.blockmap
            pack/**/*.yml
            pack/**/*.blockmap

      - name: Upload Linux artifacts
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-linux
          path: |
            pack/*.AppImage
            pack/*.deb
            pack/*.rpm
            pack/*.flatpak
            pack/*.snap
            pack/*.freebsd
            pack/*.tar.gz
            pack/**/*.yml
            pack/**/*.blockmap

      - name: Upload Windows artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          path: |
            pack/*.exe
            pack/nsis-web/*.nsis.7z
            pack/nsis-web/*.exe
            pack/**/*.yml
            pack/**/*.blockmap

  publish:
    name: Publish release
    needs: build
    if: github.repository == 'michei69/pear-desktop' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_ENV
          echo "CHANGELOG_ANCHOR=$(echo "v$VERSION" | sed -e 's/\.//g')" >> $GITHUB_ENV

      - name: Check if version already exists in tags
        run: |
          echo "VERSION_HASH=$(git rev-parse -q --verify 'refs/tags/${{ env.VERSION_TAG }}')" >> $GITHUB_ENV

      - name: Download build artifacts
        if: ${{ env.VERSION_HASH == '' }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        if: ${{ env.VERSION_HASH == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "See [changelog](https://github.com/michei69/pear-desktop/blob/master/changelog.md#${CHANGELOG_ANCHOR}) for the list of updates and the full diff."
            echo
            echo "Thanks to all contributors! 🏅"
            echo
            echo "(Note for Windows: \`YouTube-Music-Web-Setup-${VERSION}.exe\` is an installer, and \`YouTube-Music-${VERSION}.exe\` is a portable version)"
          } > notes.md

          # Collect the installers plus the updater metadata (latest*.yml and
          # their blockmaps), skipping the nsis uninstaller helper as well as
          # the yml files electron-builder embeds/downloads rather than
          # publishes (app-update.yml, builder-debug.yml).
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file" | tr ' ' '-')"
          done < <(find artifacts -type f \( \
            -name '*.exe' -o -name '*.nsis.7z' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.flatpak' \
            -o -name '*.tar.gz' -o -name '*.freebsd' -o -name '*.zip' \
            -o -name 'latest*.yml' -o -name '*.blockmap' \) ! -name '*uninstaller*' -print0)

          mapfile -d '' assets < <(find release-assets -type f -print0)

          # One versioned release, tagged v<version> at the commit that was
          # built. Never re-created: an existing tag means the release already
          # happened (the steps above skip in that case).
          gh release create "v$VERSION" "${assets[@]}" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest \
            --target "${{ github.sha }}"

      - name: Update changelog
        if: ${{ env.VERSION_HASH == '' }}
        run: |
          # No fetch of the tag created above: auto-changelog builds the top
          # section from package.json's version and compares it to the latest
          # stable tag. Fetching v<version> would add a second, empty heading
          # for the same version and move the release-notes anchor to it.
          pnpm changelog

      - name: Commit changelog
        if: ${{ env.VERSION_HASH == '' }}
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: Update changelog for ${{ env.VERSION_TAG }}
          file_pattern: "changelog.md"
          commit_user_name: CI
          commit_user_email: th-ch@users.noreply.github.com
