name: Build Pear Desktop

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"
  # Baked into the build and shown in the About window (src/app-info.ts).
  PEAR_CHANNEL: beta
  PEAR_COMMIT: ${{ github.sha }}

jobs:
  build:
    # Beta builds only produce artifacts, the publish-beta job below owns the release.
    permissions:
      contents: read
    name: Build Pear Desktop
    if: github.repository == 'michei69/pear-desktop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-26, ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Every job in the matrix must stamp the SAME version (github.run_number) before
      # installing/building, otherwise the platform artifacts disagree on the version.
      # The version in package.json is the release the betas lead up to, so 3.12.4
      # (bumped by hand when a cycle starts) becomes 3.12.4-beta.42. A prerelease sorts
      # below its release, so the eventual 3.12.4 is a real upgrade for every beta user.
      # The lockfile has no root version, so `--frozen-lockfile` stays valid after this.
      - name: Stamp beta version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "const v = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version.split('-')[0]; v + '-beta.' + process.env.RUN_NUMBER")
          echo "Beta version: $VERSION"
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version --no-git-checks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Beta builds never publish a versioned release: the installers built here
      # are attached to the v<version> pre-release by the publish-beta job below.
      # One electron-builder pass per platform, so every target lands in pack/.
      # The beta:* scripts force -c.publish.channel=beta: GitHub publishing never
      # auto-detects the channel from the version (electron-builder#8589), so without
      # it the metadata would be latest*.yml instead of beta*.yml.
      # `pnpm version` writes package.json on the runner only; master keeps the
      # release version, which is what the release workflow ships unchanged.
      - name: Build on Mac
        if: startsWith(matrix.os, 'macOS')
        run: pnpm beta:mac

      - name: Build on Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Platform/aarch64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/aarch64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/aarch64/24.08
          pnpm beta:linux

      - name: Build on Windows
        if: startsWith(matrix.os, 'windows')
        run: pnpm beta:win

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-macos
          path: |
            pack/*.dmg
            pack/*.dmg.blockmap
            pack/*.zip
            pack/*.zip.blockmap
            pack/**/*.yml
            pack/**/*.blockmap

      - name: Upload Linux artifacts
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-linux
          path: |
            pack/*.AppImage
            pack/*.deb
            pack/*.rpm
            pack/*.flatpak
            pack/*.snap
            pack/*.freebsd
            pack/*.tar.gz
            pack/**/*.yml
            pack/**/*.blockmap

      - name: Upload Windows artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          path: |
            pack/*.exe
            pack/nsis-web/*.nsis.7z
            pack/nsis-web/*.exe
            pack/**/*.yml
            pack/**/*.blockmap

  publish-beta:
    name: Publish beta pre-release
    needs: build
    if: github.repository == 'michei69/pear-desktop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-beta
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish beta pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Same derivation as the build job: package.json is untouched on master,
          # so this reproduces the exact version stamped into the artifacts.
          VERSION=$(node -p "const v = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version.split('-')[0]; v + '-beta.' + process.env.RUN_NUMBER")
          echo "Beta version: $VERSION"

          # The beta release being replaced: the newest prerelease, or the legacy
          # rolling `beta` tag from before the channel existed.
          PREV_TAG=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)][0].tagName // "beta"')
          echo "Replacing prerelease: $PREV_TAG"

          # Notes read like the dev build's: everything on master since the last
          # stable release. Beta tags are excluded so a beta never becomes the
          # baseline for the next one.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-beta*' 2>/dev/null || echo "")

          {
            echo "Beta ${VERSION}, built from master. Same commits as a dev build, packaged."
            echo
            if [ -n "$LATEST_TAG" ]; then
              echo "### Changes since ${LATEST_TAG}"
              echo
              git log --pretty=format:'* %s (%h)' "${LATEST_TAG}..HEAD"
            else
              echo "### Recent changes"
              echo
              git log --pretty=format:'* %s (%h)' -50
            fi
            echo
            echo
            echo "[All commits since ${LATEST_TAG:-the last release}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/master)"
            echo
            echo "Built from commit ${GITHUB_SHA}."
          } > notes.md

          # Collect the installers plus the updater metadata (beta*.yml + blockmaps),
          # skipping the nsis uninstaller helper.
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file" | tr ' ' '-')"
          done < <(find artifacts -type f \( \
            -name '*.exe' -o -name '*.nsis.7z' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.flatpak' \
            -o -name '*.tar.gz' -o -name '*.freebsd' -o -name '*.zip' \
            -o -name '*.yml' -o -name '*.blockmap' \) ! -name '*uninstaller*' -print0)

          mapfile -d '' assets < <(find release-assets -type f -print0)

          # One rolling beta release, rebuilt in place: the previous one is removed
          # so this stays the single prerelease entry, carrying the installers and
          # the beta*.yml electron-updater reads. The tag has to be valid semver or
          # the GitHub provider skips it - a tag named plain `beta` never could be
          # picked up - which is why the entry is tagged v${VERSION}.
          gh release delete "$PREV_TAG" --cleanup-tag --yes || true
          gh release create "v$VERSION" "${assets[@]}" \
            --title "Pear Desktop ${VERSION} (beta)" \
            --notes-file notes.md \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}"
