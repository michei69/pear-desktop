name: Build Pear Desktop

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"

jobs:
  build:
    permissions:
      contents: write
    if: github.event.pull_request.draft == false
    name: Build Pear Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-26, ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only vite build without release if it is a fork, or it is a pull-request
      - name: Vite Build
        if: github.repository == 'michei69/pear-desktop' && github.event_name == 'pull_request'
        run: |
          pnpm build

      # Build and release if it's the main repository and is not pull-request
      - name: Build and release on Mac
        if: startsWith(matrix.os, 'macOS') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm release:mac

      - name: Build and release on Linux
        if: startsWith(matrix.os, 'ubuntu') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Platform/aarch64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/aarch64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/aarch64/24.08
          pnpm release:linux

      - name: Build and release on Windows
        if: startsWith(matrix.os, 'windows') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm release:win

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macOS') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-macos
          path: |
            pack/*.dmg
            pack/*.dmg.blockmap

      - name: Upload Linux artifacts
        if: startsWith(matrix.os, 'ubuntu') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-linux
          path: |
            pack/*.AppImage
            pack/*.deb
            pack/*.rpm
            pack/*.flatpak
            pack/*.snap
            pack/*.freebsd
            pack/*.tar.gz

      - name: Upload Windows artifacts
        if: startsWith(matrix.os, 'windows') && (github.repository == 'michei69/pear-desktop' && github.event_name != 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          path: |
            pack/*.exe
            pack/nsis-web/*.nsis.7z
            pack/nsis-web/*.exe

      # disabled temporarily
      - name: Test
        if: github.repository == ''
        uses: coactions/setup-xvfb@v1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        with:
          run: pnpm test:debug

  publish-beta:
    name: Publish beta pre-release
    needs: build
    if: github.repository == 'michei69/pear-desktop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-beta
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish beta pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")

          {
            echo "Rolling beta pre-release, rebuilt from master on every push."
            echo
            if [ -n "$LATEST_TAG" ]; then
              echo "### Changes since ${LATEST_TAG}"
              echo
              git log --pretty=format:'* %s (%h)' "${LATEST_TAG}..HEAD"
            else
              echo "### Recent changes"
              echo
              git log --pretty=format:'* %s (%h)' -20
            fi
            echo
            echo
            echo "Built from commit ${GITHUB_SHA}. Not an official release."
          } > notes.md

          # Collect the installers, skipping updater metadata and the nsis uninstaller helper
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file" | tr ' ' '-')"
          done < <(find artifacts -type f \( \
            -name '*.exe' -o -name '*.nsis.7z' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.flatpak' \
            -o -name '*.tar.gz' -o -name '*.freebsd' \) ! -name '*uninstaller*' -print0)

          mapfile -d '' assets < <(find release-assets -type f -print0)

          gh release delete beta --cleanup-tag --yes || true
          gh release create beta "${assets[@]}" \
            --title "Latest beta build" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"
