name: reviewdog

on: [pull_request_target]

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  oxlint:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    name: runner / oxlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # Lint the PR's own code against its own dependencies: installing the base
      # branch's deps made every dependency-adding PR report error-typed imports.
      # Only same-repository branches reach this job (see `if` above), so the
      # install still runs code only collaborators can change.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: latest

      - name: Run oxlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          nub exec oxlint apps packages plugins src --type-aware --format=checkstyle |
            reviewdog \
              -f=checkstyle \
              -name=oxlint \
              -reporter=github-pr-review \
              -filter-mode=file \
              -fail-level=error \
              -tee
